services:
  - type: web
    name: homeserve-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.utils.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_MODE
        value: simulation
      - key: MEDIA_STORAGE_DRIVER
        value: local
      - key: PYTHON_VERSION
        value: 3.11.9
